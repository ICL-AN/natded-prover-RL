[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "natded-prover"
version = "0.1.0"
description = "Natural Deduction Prover with FOL + Neuro-symbolic search policies"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "torch"
]

[tool.setuptools.packages.find]
include = ["natded*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
